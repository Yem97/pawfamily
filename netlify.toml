[build]
  publish = "site"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# Website pages are handled by the single-page app (site/index.html).
# Routes are listed explicitly (no catch-all) so /api/*, /adopt/<pet>, /sitemap.xml and /robots.txt reach their functions.
[[redirects]]
  from = "/adopt"
  to = "/index.html"
  status = 200
# /adopt/<pet> is served by netlify/functions/share.mjs (adds that pet's preview for Facebook/Google).
[[redirects]]
  from = "/how-to-adopt"
  to = "/index.html"
  status = 200
[[redirects]]
  from = "/happy-tails"
  to = "/index.html"
  status = 200
[[redirects]]
  from = "/about"
  to = "/index.html"
  status = 200
[[redirects]]
  from = "/help"
  to = "/index.html"
  status = 200
[[redirects]]
  from = "/faq"
  to = "/index.html"
  status = 200
[[redirects]]
  from = "/contact"
  to = "/index.html"
  status = 200
[[redirects]]
  from = "/donate"
  to = "/index.html"
  status = 200
[[redirects]]
  from = "/privacy"
  to = "/index.html"
  status = 200
[[redirects]]
  from = "/admin/*"
  to = "/admin/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
    Strict-Transport-Security = "max-age=31536000"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"

[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"
